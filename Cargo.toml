[package]
name = "dfs"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4.41"
clap = { version = "4.5.40", features = ["derive"] }
dotenv = "0.15.0"
env_logger = "0.11.6"
jni = { version = "0.21.1", features = ["invocation"] }
log = "0.4.26"
rusqlite = "0.35.0"
serde = { version =  "1.0.225", features = ["derive", "std"]}
serde_json = "1.0.145"


[profile.dev]
opt-level = 1

[lib]
crate-type = ["lib", "cdylib"]
